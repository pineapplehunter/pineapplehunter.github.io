<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ description }}">
  <title>{{ title }}{% if section != "home" %} | {{ profile.name }}{% endif %}</title>
  <!-- inline-css -->
</head>
<body class="flex min-h-screen flex-col bg-paper font-sans text-ink antialiased">
  <a href="#main" class="sr-only z-10 rounded-md bg-white px-3 py-2 focus-visible:not-sr-only focus-visible:absolute focus-visible:top-2 focus-visible:left-2">Skip to content</a>
  <header class="border-b border-rule">
    <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-x-6 gap-y-2 px-5 py-3 sm:px-8">
      <a href="{{ root }}" class="inline-flex min-h-11 items-center gap-2.5 font-mono text-sm font-semibold text-indigo-ink hover:underline" {% if section == "home" %}aria-current="page"{% endif %}>
        <span aria-hidden="true" class="size-2 rounded-full bg-indigo-ink"></span>{{ profile.handle }}
      </a>
      <nav aria-label="Main">
        <ul class="flex gap-5 text-sm font-medium text-muted sm:gap-6">
          {% for nav_section, label in [("blog", "Writing"), ("about", "About")] %}
          <li>
            <a href="{{ root }}{{ nav_section }}/" class="inline-flex min-h-11 items-center decoration-2 underline-offset-8 hover:text-indigo-ink hover:underline aria-[current=page]:font-bold aria-[current=page]:text-indigo-ink aria-[current=page]:underline aria-[current=location]:underline"
              {% if section == nav_section %}aria-current="page"{% elif section == "post" and nav_section == "blog" %}aria-current="location"{% endif %}>{{ label }}</a>
          </li>
          {% endfor %}
          <li><a href="{{ profile.github }}" class="inline-flex min-h-11 items-center hover:text-indigo-ink hover:underline">GitHub <span class="ms-1" aria-hidden="true">↗</span></a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main" tabindex="-1" class="mx-auto w-full max-w-5xl flex-1 px-5 pt-9 pb-18 sm:px-8 sm:pt-13">
    {% block main %}{% endblock %}
  </main>
  <footer class="border-t border-rule">
    <div class="mx-auto flex max-w-5xl flex-wrap items-baseline justify-between gap-x-6 gap-y-2 px-5 py-6 text-sm text-muted sm:px-8">
      <span>{{ profile.name }}</span>
      <span>{{ profile.location }}</span>
    </div>
  </footer>
</body>
</html>
