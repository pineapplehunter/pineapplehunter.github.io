{% extends "base.html" %}

{% block main %}
<section class="max-w-[42rem] rounded-2xl bg-indigo-ink p-6 text-white sm:p-9" aria-labelledby="error-title">
  <p class="font-mono text-sm font-semibold text-gold">404</p>
  <h1 id="error-title" class="mt-2 text-4xl font-bold tracking-tight sm:text-5xl">{{ ui.not_found }}</h1>
  <p class="mt-4 text-lilac">{{ ui.not_found_description }}</p>
  <a href="{{ home }}" class="mt-6 inline-flex min-h-11 items-center rounded-md bg-gold px-4 text-sm font-bold text-indigo-ink hover:bg-white focus-visible:outline-gold">{{ ui.back }}</a>
</section>
{% endblock %}
